<!-- 手表端投稿页：极简垂直流布局 -->
<!-- 文件目录：JASPERBLOG/modular-watch/submit/index.html -->
<div class="watch-submit-module">
    
    <!-- 顶部简介 -->
    <div class="watch-header-section glass-panel">
        <h1><i class="fa-regular fa-pen-to-square"></i> 投稿中心</h1>
        <p>分享优质作品。严格遵守法律法规。</p>
    </div>

    <!-- 手表的单列流列表 -->
    <div class="watch-submit-list">
        
        <!-- 卡片 1：审核规则 -->
        <div class="watch-submit-card glass-panel">
            <div class="watch-card-header"><i class="fa-solid fa-list-check"></i> 审核规则</div>
            <div class="watch-card-body" id="watch-rules-content"></div>
        </div>

        <!-- 卡片 2：投稿方式 -->
        <div class="watch-submit-card glass-panel">
            <div class="watch-card-header"><i class="fa-regular fa-folder-open"></i> 投稿方式</div>
            <div class="watch-card-body" id="watch-method-content"></div>
        </div>

        <!-- 卡片 3：邮件模板 (极简白框) -->
        <div class="watch-submit-card glass-panel">
            <div class="watch-card-header"><i class="fa-regular fa-envelope"></i> 邮件模板</div>
            <div class="watch-card-body" id="watch-template-content"></div>
        </div>

        <!-- 卡片 4：快捷直达 -->
        <div class="watch-submit-card glass-panel">
            <div class="watch-card-header"><i class="fa-solid fa-bolt"></i> 一键直达</div>
            <div class="watch-card-body" id="watch-quick-submit-content"></div>
        </div>

    </div>
</div>

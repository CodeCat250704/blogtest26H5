<div class="watch-notice-module">
    <div class="watch-notice-header">
        <span><i class="fa-regular fa-bell"></i> 通知</span>
        <span id="watch-notice-count" style="font-size: 10px; color: rgba(255,255,255,0.3);">0条</span>

    <div class="watch-notice-list" id="watch-notice-list">
        <div class="watch-empty-state">

            <span>暂无通知</span>
        </div>
    </div>
</div>

<div class="watch-settings-module">
    <div class="watch-settings-header">
        <div class="icon-wrap"><i class="fa-solid fa-palette"></i></div>
        <h1>主题</h1>
    </div>
    <div class="watch-settings-card">
        <div class="watch-theme-group">
            <button class="watch-theme-btn" data-theme="dark"><i class="fa-solid fa-moon"></i></button>
            <button class="watch-theme-btn active" data-theme="light"><i class="fa-solid fa-sun"></i></button>
            <button class="watch-theme-btn" data-theme="sunset"><i class="fa-solid fa-cloud-sun"></i></button>
        </div>
    </div>
</div>

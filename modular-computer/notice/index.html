<!-- 电脑端通知页：双栏布局 (左侧分类，右侧消息流) -->
<!-- 文件目录：JASPERBLOG/modular-computer/notice/index.html -->
<div class="pc-notice-module">
    
    <!-- 顶部标题栏 -->
    <div class="pc-notice-header-bar glass-panel">
        <div class="header-left">
            <i class="fa-regular fa-bell"></i>
            <span>通知中心</span>
            <span class="total-badge" id="pc-notice-count">0</span>
        </div>
        <div class="header-right">
            <button id="mark-all-read" class="btn-ghost"><i class="fa-regular fa-circle-check"></i> 全部已读</button>
        </div>
    </div>

    <!-- 下方双栏主体 -->
    <div class="pc-notice-body">
        <!-- 左侧：分类类型过滤 -->
        <div class="pc-notice-sidebar glass-panel">
            <div class="sidebar-title">消息分类</div>
            <div id="pc-notice-filters" class="filter-list">
                <!-- 过滤器由 JS 生成 -->
            </div>
        </div>

        <!-- 右侧：通知消息流 (按时间倒序) -->
        <div class="pc-notice-feed glass-panel">
            <div id="pc-notice-list" class="feed-list">
                <!-- 通知卡片由 JS 动态渲染 -->
                <div class="pc-empty-state">
                    <i class="fa-regular fa-bell-slash" style="font-size: 48px; opacity: 0.2; display: block; margin-bottom: 16px;"></i>
                    <h3>暂无通知消息</h3>
                    <p>系统通知和文章更新会出现在这里</p>
                </div>
            </div>
        </div>
    </div>
</div>

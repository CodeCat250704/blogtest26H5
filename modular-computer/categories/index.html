<!-- 纯净独立分类页（无任务栏，仅保留返回首页功能） -->
<!-- 文件目录：JASPERBLOG/modular-computer/categories/index.html -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>分类 - JASPERBLOG</title>
        <!-- 网站标签页图标 -->
    <link rel="icon" href="/overall-situation/background.png" type="image/png">
    
    <!-- 图标库 -->
    <link rel="stylesheet" href="https://cdn.staticfile.org/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        /* ==========================================================
         * 【独立页面专属样式】自给自足，不依赖外部 CSS
         * ========================================================== */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body, html {
            width: 100%; height: 100%; overflow: hidden;
            font-family: -apple-system, sans-serif;
            background-color: #f0f4f8;
            color: #222;
        }

        /* 背景壁纸 (直接使用根目录的 background.png) */
        .page-background {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-image: url('/overall-situation/background.png'); 
            background-size: cover; background-position: center;
            z-index: 0;
        }
        /* 背景压暗蒙层 */
        .page-background::after {
            content: ''; position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            z-index: 1;
        }

        /* 页面主体层 */
        .page-content {
            position: relative; z-index: 2;
            width: 100%; height: 100vh;
            padding: 20px;
            box-sizing: border-box;
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        /* --- 1. 独立返回首页按钮 --- */
        .back-home-btn {
            position: fixed;
            top: 20px; left: 20px;
            z-index: 99;
            display: flex; align-items: center; gap: 8px;
            padding: 8px 18px;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(79, 156, 247, 0.3);
            border-radius: 30px;
            color: #333;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .back-home-btn:hover {
            transform: translateY(-2px);
            background: rgba(255, 255, 255, 0.95);
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }
        .back-home-btn i { font-size: 16px; color: #4F9CF7; }

        /* --- 2. 毛玻璃卡片逻辑 --- */
        .glass-panel {
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(79, 156, 247, 0.3);
            border-radius: 14px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.3s ease, background 0.3s ease;
        }

        /* --- 3. 分类页三栏布局核心 --- */
        .categories-module {
            display: flex; flex-direction: column; height: 100%; gap: 10px;
        }

        /* 最顶层：浏览器多标签页栏 */
        .global-tab-bar {
            display: flex; align-items: flex-end; padding: 0 12px;
            flex-shrink: 0; height: 44px;
            border-radius: 14px 14px 0 0; gap: 4px;
            border-bottom: none;
        }
        .tab-item {
            display: flex; align-items: center; gap: 8px; padding: 6px 14px;
            border-radius: 8px 8px 0 0; cursor: pointer;
            color: rgba(50, 50, 50, 0.7); font-size: 13px;
            border: 1px solid transparent; border-bottom: 2px solid transparent;
            transition: all 0.2s; white-space: nowrap; max-width: 180px;
        }
        .tab-item i { font-size: 14px; }
        .tab-item .tab-title { overflow: hidden; text-overflow: ellipsis; flex: 1; }
        .tab-item .tab-close { font-size: 14px; opacity: 0.4; transition: 0.2s; margin-left: 4px; padding: 0 2px; }
        .tab-item:hover { background: rgba(255,255,255,0.2); color: #111; }
        .tab-item.active {
            background: rgba(255,255,255,0.4); color: #111;
            border: 1px solid rgba(79, 156, 247, 0.5);
            border-bottom: 2px solid #4F9CF7;
        }
        .tab-add-btn { display: flex; align-items: center; justify-content: center; padding: 6px 10px; cursor: pointer; color: rgba(50,50,50,0.5); border-radius: 6px; }
        .tab-add-btn:hover { color: #111; background: rgba(255,255,255,0.2); }

        /* 下方三栏主容器 */
        .win11-layout {
            flex: 1; display: flex; padding: 0; gap: 0; min-height: 0;
            border-radius: 0 0 14px 14px; overflow: hidden;
            border-top: none; background: transparent;
        }

        /* 左：导航窗格 */
        .nav-pane {
            width: 18%; min-width: 160px; display: flex; flex-direction: column;
            border-right: 1px solid rgba(79, 156, 247, 0.3); padding: 14px 10px; flex-shrink: 0;
        }
        .address-bar {
            display: flex; align-items: center; background: rgba(255,255,255,0.1);
            border: 1px solid rgba(79, 156, 247, 0.2); border-radius: 8px; padding: 4px 12px; margin-bottom: 16px; flex-shrink: 0;
        }
        .address-bar i { color: rgba(50,50,50,0.6); font-size: 14px; margin-right: 8px; }
        .address-bar input {
            flex: 1; background: transparent; border: none; outline: none;
            color: #111; font-size: 14px; padding: 6px 0;
        }
        .address-bar input::placeholder { color: rgba(50,50,50,0.5); }
        .nav-tree-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 6px; }

        /* 中：文章列表窗格 */
        .content-pane {
            width: 20%; min-width: 140px; display: flex; flex-direction: column;
            padding: 14px 8px; border-right: 1px solid rgba(79, 156, 247, 0.3);
        }
        .pane-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }

        /* 右：阅读预览区 */
        .reader-pane { flex: 1; display: flex; flex-direction: column; padding: 12px 12px 12px 0; }
        .reading-content {
            flex: 1; background: rgba(255, 255, 255, 0.35); backdrop-filter: blur(6px);
            border-radius: 12px; border: 1px solid rgba(79, 156, 247, 0.3);
            display: flex; align-items: center; justify-content: center; text-align: center; position: relative; padding: 20px; overflow: hidden;
        }
        .empty-preview h1 { font-size: 40px; color: #111; font-weight: 300; margin-bottom: 10px; }
        .empty-preview p { font-size: 15px; color: rgba(50,50,50,0.6); }

        /* 按钮 / 列表项 (移除了 var(--text-main)，改为直接写颜色) */
        .category-btn, .article-item {
            padding: 8px 12px; border-radius: 6px; cursor: pointer; transition: all 0.15s ease;
            display: flex; flex-direction: column; border: 1px solid transparent;
        }
        .category-btn { flex-direction: row; align-items: center; gap: 8px; color: #111; font-size: 13px; }
        .category-btn i { font-size: 14px; color: rgba(50,50,50,0.6); width: 16px; text-align: center; }
        .article-item .title { color: #111; font-size: 13px; font-weight: 500; }
        .article-item .subtitle { color: rgba(50,50,50,0.6); font-size: 11px; margin-top: 2px; }

        .category-btn:hover, .article-item:hover { background: rgba(255,255,255,0.3); }
        .category-btn.active, .article-item.active {
            background: rgba(79, 156, 247, 0.2); border-color: #4F9CF7; color: #4F9CF7;
        }

        /* 滚动条 */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.05); }
        ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.15); border-radius: 10px; }
    </style>
</head>
<body>
    
    <!-- 壁纸背景 -->
    <div class="page-background"></div>

    <!-- 1. 独立返回首页按钮 -->
        <!-- 1. 返回首页占位符 (由 JS 决定是否显示) -->
    <div id="back-home-placeholder"></div>

    <!-- 2. 分类内容主体 -->
    <div class="page-content">
        <div class="categories-module">
            
            <!-- 最顶层：浏览器多标签页栏 -->
            <div id="global-tab-bar" class="global-tab-bar glass-panel">
                <!-- 此处将由 JS 动态插入标签页 -->
            </div>

            <!-- 下方三栏主体容器 -->
            <div class="win11-layout">
                <!-- 左侧：导航列表 + 搜索 -->
                <div class="nav-pane glass-panel">
                    <div class="address-bar">
                        <i class="fa-solid fa-magnifying-glass"></i>
                        <input type="text" id="search-input" placeholder="搜索文章..." autocomplete="off">
                    </div>
                    <div id="category-switch-list" class="nav-tree-list"></div>
                </div>

                <!-- 中间：文章列表 -->
                <div class="content-pane glass-panel">
                    <div id="article-switch-list" class="pane-list"></div>
                </div>

                <!-- 右侧：阅读预览区 -->
                <div class="reader-pane">
                    <div class="reading-content" id="embedded-reader-content">
                        <div class="empty-preview">
                            <h1>阅读文章区域</h1>
                            <p>请从左侧选择分类与文章以开始阅读</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

        <!-- 2. 智能判断返回按钮逻辑 -->
    <script>
        (function() {
            const placeholder = document.getElementById('back-home-placeholder');
            if (!placeholder) return;

            // 判断当前页面是如何被打开的：
            // 如果 document.referrer 包含了 "modular-computer/home"，说明是从首页路由跳进来的。
            // 如果是直接访问该 URL，document.referrer 为空。
            const isStandalone = !document.referrer || !document.referrer.includes('/modular-computer/');
            
            if (isStandalone) {
                // 只有在独立直接访问时，才插入“返回首页”按钮
                placeholder.innerHTML = `
                    <a href="/index.html" class="back-home-btn">
                        <i class="fa-solid fa-arrow-left"></i> 返回首页
                    </a>
                `;
            }
            // 如果是通过路由加载的，保持为空（任务栏会提供返回功能）
        })();
    </script>
    <!-- 3. 加载分类页专属脚本 (不需要任何外部壳子的 JS) -->
    <script src="script.js"></script>

</body>
</html>

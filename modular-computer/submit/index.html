<!-- 电脑端投稿页：全新卡片化布局 -->
<!-- 文件目录：JASPERBLOG/modular-computer/submit/index.html -->
<div class="pc-submit-module">
    
    <!-- 顶部大标题 -->
    <div class="pc-submit-header glass-panel">
        <h1><i class="fa-regular fa-pen-to-square"></i> 投稿中心</h1>
        <p>遵循规范，分享您的优质作品。所有审核流程严格遵守《中华人民共和国网络安全法》及《网络信息内容生态治理规定》。</p>
    </div>

    <div class="pc-submit-grid">
        
        <!-- 左侧主要区域：审核规则 + 投递方式 -->
        <div class="pc-submit-left">
            
            <!-- 卡片1：审核规则 -->
            <div class="submit-card glass-panel">
                <div class="card-header">
                    <i class="fa-solid fa-list-check"></i>
                    <span>审核规则与投稿须知</span>
                </div>
                <div class="card-body" id="pc-rules-content">
                    <!-- 内容由 JS 动态注入 -->
                </div>
            </div>

            <!-- 卡片2：投稿方式 -->
            <div class="submit-card glass-panel">
                <div class="card-header">
                    <i class="fa-regular fa-folder-open"></i>
                    <span>投稿方式与规范</span>
                </div>
                <div class="card-body" id="pc-method-content">
                    <!-- 内容由 JS 动态注入 -->
                </div>
            </div>

        </div>

        <!-- 右侧主要区域：邮件模板 + 快捷入口 -->
        <div class="pc-submit-right">
            
            <!-- 卡片3：邮件发送模板 (白框复刻) -->
            <div class="submit-card glass-panel">
                <div class="card-header">
                    <i class="fa-regular fa-envelope"></i>
                    <span>邮件发送模板</span>
                </div>
                <div class="card-body" id="pc-template-content">
                    <!-- 内容由 JS 动态注入 -->
                </div>
            </div>

            <!-- 卡片4：一键直达 -->
            <div class="submit-card glass-panel">
                <div class="card-header">
                    <i class="fa-solid fa-bolt"></i>
                    <span>一键直达投稿</span>
                </div>
                <div class="card-body" id="pc-quick-submit-content">
                    <!-- 内容由 JS 动态注入 -->
                </div>
            </div>

        </div>
    </div>

</div>

<!-- 手机端通知页 -->
<!-- 文件目录：JASPERBLOG/modular-phone/notice/index.html -->
<div class="phone-notice-module">
    <div class="phone-notice-header">
        <h2><i class="fa-regular fa-bell"></i> 通知中心</h2>
        <span id="phone-notice-count" class="badge">0</span>
    </div>
    <div class="phone-notice-list" id="phone-notice-list">
        <!-- 通知列表由 JS 动态渲染 -->
        <div class="phone-empty-state">
            <i class="fa-regular fa-bell-slash" style="font-size: 40px; opacity: 0.3; margin-bottom: 16px;"></i>
            <p>暂无通知消息</p>
        </div>
    </div>
</div>

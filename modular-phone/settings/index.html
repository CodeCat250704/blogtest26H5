<div class="phone-settings-module">
    <div class="phone-settings-header-area">
        <div class="icon-wrap"><i class="fa-solid fa-palette"></i></div>
        <div><h1>设置</h1><div class="subtitle">视觉主题</div></div>
    </div>
    <div class="phone-settings-card">
        <div class="phone-card-header"><i class="fa-solid fa-gear"></i> 系统主题</div>
        <div class="phone-card-body">
            <div class="phone-setting-item">
                <div class="label">主题模式</div>
                <div class="phone-theme-group">
                    <button class="phone-theme-btn" data-theme="dark"><i class="fa-solid fa-moon"></i> <span>深色</span></button>
                    <button class="phone-theme-btn active" data-theme="light"><i class="fa-solid fa-sun"></i> <span>亮色</span></button>
                    <button class="phone-theme-btn" data-theme="sunset"><i class="fa-solid fa-cloud-sun"></i> <span>黄昏</span></button>
                </div>
            </div>
        </div>
    </div>
</div>

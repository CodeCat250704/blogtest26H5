<!-- 手机端投稿页：单栏卡片化布局 -->
<div class="phone-submit-module">
    <div class="phone-submit-header glass-panel">
        <h1><i class="fa-regular fa-pen-to-square"></i> 投稿中心</h1>
        <p>遵循规范，分享优质作品。严格遵守《网络安全法》及《网络信息内容生态治理规定》。</p>
    </div>
    <div class="phone-submit-grid">
        <div class="submit-card glass-panel"><div class="card-header"><i class="fa-solid fa-list-check"></i>审核规则</div><div class="card-body" id="phone-rules-content"></div></div>
        <div class="submit-card glass-panel"><div class="card-header"><i class="fa-regular fa-folder-open"></i>投稿方式</div><div class="card-body" id="phone-method-content"></div></div>
        <div class="submit-card glass-panel"><div class="card-header"><i class="fa-regular fa-envelope"></i>邮件模板</div><div class="card-body" id="phone-template-content"></div></div>
        <div class="submit-card glass-panel"><div class="card-header"><i class="fa-solid fa-bolt"></i>一键直达</div><div class="card-body" id="phone-quick-submit-content"></div></div>
    </div>
</div>

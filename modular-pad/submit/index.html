<!-- 平板端投稿页：两栏卡片化布局 -->
<!-- 文件目录：JASPERBLOG/modular-pad/submit/index.html -->
<div class="pad-submit-module">
    
    <!-- 顶部大标题 -->
    <div class="pad-submit-header glass-panel">
        <h1><i class="fa-regular fa-pen-to-square"></i> 投稿中心</h1>
        <p>遵循规范，分享您的优质作品。所有审核流程严格遵守《中华人民共和国网络安全法》及《网络信息内容生态治理规定》。</p>
    </div>

    <div class="pad-submit-grid">
        <!-- 左侧区域：审核规则 + 投递方式 -->
        <div class="pad-submit-left">
            <div class="submit-card glass-panel">
                <div class="card-header"><i class="fa-solid fa-list-check"></i><span>审核规则与投稿须知</span></div>
                <div class="card-body" id="pad-rules-content"></div>
            </div>
            <div class="submit-card glass-panel">
                <div class="card-header"><i class="fa-regular fa-folder-open"></i><span>投稿方式与规范</span></div>
                <div class="card-body" id="pad-method-content"></div>
            </div>
        </div>

        <!-- 右侧区域：邮件模板 + 快捷入口 -->
        <div class="pad-submit-right">
            <div class="submit-card glass-panel">
                <div class="card-header"><i class="fa-regular fa-envelope"></i><span>邮件发送模板</span></div>
                <div class="card-body" id="pad-template-content"></div>
            </div>
            <div class="submit-card glass-panel">
                <div class="card-header"><i class="fa-solid fa-bolt"></i><span>一键直达投稿</span></div>
                <div class="card-body" id="pad-quick-submit-content"></div>
            </div>
        </div>
    </div>
</div>

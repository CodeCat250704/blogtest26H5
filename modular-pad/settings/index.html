<div class="pad-settings-module">
    <div class="pad-settings-header-area">
        <div class="icon-wrap"><i class="fa-solid fa-palette"></i></div>
        <div>
            <h1>个性化设置</h1>
            <div class="subtitle">管理 JASPER Blog 的视觉与体验</div>
        </div>
    </div>
    <div class="pad-settings-card">
        <div class="pad-card-header"><i class="fa-solid fa-gear"></i> 系统主题</div>
        <div class="pad-card-body">
            <div class="pad-setting-item">
                <div class="label">当前主题模式</div>
                <div class="pad-theme-group">
                    <button class="pad-theme-btn" data-theme="dark"><i class="fa-solid fa-moon"></i> <span>深色</span></button>
                    <button class="pad-theme-btn active" data-theme="light"><i class="fa-solid fa-sun"></i> <span>亮色</span></button>
                    <button class="pad-theme-btn" data-theme="sunset"><i class="fa-solid fa-cloud-sun"></i> <span>黄昏</span></button>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- 平板端主页：纯净组件版 -->
<div class="pad-home-module">
    
    <!-- 1. 沉浸式全宽轮播图 -->
    <div class="pad-hero-widget glass-panel" id="heroCarousel">
        <button class="carousel-btn prev" id="carouselPrev"><i class="fa-solid fa-chevron-left"></i></button>
        <div class="carousel-track-container">
            <ul class="carousel-track" id="carouselTrack"></ul>
        </div>
        <button class="carousel-btn next" id="carouselNext"><i class="fa-solid fa-chevron-right"></i></button>
        <div class="carousel-indicators" id="carouselIndicators"></div>
    </div>

    <!-- 2. 底部双列 Widget 布局 -->
    <div class="pad-widgets-row">
        <!-- 左侧公告板 -->
        <div class="pad-widget-col">
            <div class="widget-card glass-panel">
                <div class="widget-header"><i class="fa-regular fa-bell"></i> 公告板</div>
                <div class="widget-body" id="announcementList"></div>
            </div>
        </div>

        <!-- 右侧历史发布 -->
        <div class="pad-widget-col">
            <div class="widget-card glass-panel">
                <div class="widget-header"><i class="fa-regular fa-clock"></i> 历史发布</div>
                <div class="widget-body" id="historyListContainer">
                    <ul id="historyList" style="list-style: none; margin: 0; padding: 0;"></ul>
                </div>
            </div>
        </div>
    </div>

    <!-- 3. 全宽底部播放器 Widget -->
    <div class="pad-player-widget glass-panel">
        <div class="widget-header"><i class="fa-solid fa-headphones"></i> 音乐播放器</div>
        <div class="widget-body" id="musicListContainer"></div>
    </div>

</div>
